[project]
name = "leads-system"
version = "0.1.0"
description = "AI agency automation system: discovery, qualification, drafting and outreach agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "arq>=0.26",
  "redis>=5.0",
  "langgraph>=0.2.30",
  "openai>=1.50",
  "playwright>=1.47",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "trafilatura>=1.12",
  "feedparser>=6.0",
  "pillow>=10.4",
  "lingua-language-detector>=2.0",
  "pyyaml>=6.0",
  "phonenumbers>=8.13",
  "holidays>=0.57",
  "sse-starlette>=2.1",
  "python-dateutil>=2.9",
  "tldextract>=5.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-python-dateutil",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app/db/migrations/versions"]  # Alembic-generated

[tool.ruff.lint]
allowed-confusables = ["–", "—", "×", "’"]
select =["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PL", "C4", "PT"]
ignore = [
  "E501",     # line length is enforced by `ruff format`; long string literals are allowed
  "PLR0913",  # agents legitimately take many params
  "PLR2004",  # magic numbers in thresholds are config-backed
  "S101",     # asserts allowed in tests (scoped below too)
  "RUF012",
  "UP017",
  "PLR0911",
  "PLR0912",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N802", "PT018", "RUF043", "E501"]
"app/db/migrations/**" = ["E501", "N999"]
"app/api/**" = ["PLR0917"]  # FastAPI query parameters

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = ["feedparser.*", "trafilatura.*", "arq.*", "lingua.*", "tldextract.*", "holidays.*", "phonenumbers.*", "sse_starlette.*", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "db: requires a running PostgreSQL (DATABASE_URL); runs inside docker compose",
]
filterwarnings = ["ignore::DeprecationWarning"]
