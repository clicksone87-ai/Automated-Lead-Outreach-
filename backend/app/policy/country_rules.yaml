# Country outreach rules.
#
# Nothing here is legal advice. The owner decided to send worldwide: every country is enabled
# for discovery, drafting AND sending, except the markets in EXCLUDED_COUNTRIES (PK, IN, BD by
# default), which are rejected outright.
#
# How the policy layer reads it:
#   - A country in EXCLUDED_COUNTRIES                  -> rejected (no discovery, no outreach).
#   - A country that is not listed                    -> uses `default` below (when
#                                                         ALL_COUNTRIES_OUTREACH_ENABLED=true),
#                                                         otherwise all outreach BLOCKED.
#   - enabled: false                                   -> no drafting, no outreach.
#   - sending_enabled: false                           -> drafting only; sending BLOCKED.
#   - requires_prior_consent: true                     -> sending BLOCKED (no cold email).
#   - legal_reviewed                                   -> informational: records whether a
#                                                         lawyer has confirmed the entry.
#
# Field reference:
#   allowed_recipient_types  which recipients may receive unsolicited B2B email; the
#                            Requirements agent classifies each lead into one of:
#                            corporate_entity | sole_trader | individual | unknown
#   requires_unsubscribe / requires_postal_address / requires_sender_identity
#                            content requirements checked on every proposal
#   max_follow_ups           follow-up cap for the country (min with the global setting)
#   reviewed_by / reviewed_on  filled in by a reviewer
#
# Listed countries start from the shared template below; override fields per country (see DE).

_template: &draft
  enabled: true
  sending_enabled: true
  legal_reviewed: false
  regime_note: "Draft placeholder — EU ePrivacy Directive as implemented nationally, plus GDPR; B2B email rules differ by country. Confirm in legal review."
  allowed_recipient_types: [corporate_entity, sole_trader, individual, unknown]
  requires_prior_consent: false  # TO CONFIRM
  requires_unsubscribe: true
  requires_postal_address: true
  requires_sender_identity: true
  max_follow_ups: 2
  reviewed_by: null
  reviewed_on: null

version: 1

# Every country that is not listed below (and not excluded).
default:
  <<: *draft
  name: Other country

countries:
  US:
    name: United States
    enabled: true
    sending_enabled: true
    legal_reviewed: false
    regime_note: "Draft placeholder — commonly discussed framework is CAN-SPAM; confirm."
    allowed_recipient_types: [corporate_entity, sole_trader, individual, unknown]
    requires_prior_consent: false  # TO CONFIRM
    requires_unsubscribe: true
    requires_postal_address: true
    requires_sender_identity: true
    max_follow_ups: 2
    reviewed_by: null
    reviewed_on: null

  GB:
    name: United Kingdom
    enabled: true
    sending_enabled: true
    legal_reviewed: false
    regime_note: >-
      Draft placeholder — commonly discussed framework is PECR + UK GDPR, which treats
      corporate subscribers differently from sole traders/partnerships; confirm.
    # For the legal review: PECR limits unsolicited email to sole traders/individuals.
    allowed_recipient_types: [corporate_entity, sole_trader, individual, unknown]
    requires_prior_consent: false                 # TO CONFIRM (for corporate subscribers)
    requires_unsubscribe: true
    requires_postal_address: true
    requires_sender_identity: true
    max_follow_ups: 2
    reviewed_by: null
    reviewed_on: null

  # ── EU-27 (alphabetical by country name) ───────────────────────────────────
