# Local stack. Memory limits keep the whole stack around 4.5 GB.
# Moving to a single Linux server is a config change: same file, different .env.

x-backend: &backend
  build: ./backend
  image: leads-backend:local
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://leads:leads@postgres:5432/leads
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: /data
    SITE_BUILDER_DIR: /cache/site-builder
  volumes:
    - ./data:/data
    - sitebuilder:/cache/site-builder
    - ./backups:/backups
    - ./site-templates:/site-templates:ro
    - ./email-templates:/email-templates:ro
    - ./.env.example:/app/.env.example:ro  # checked by the config test
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: leads
      POSTGRES_DB: leads
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leads -d leads"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { memory: 512m }
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { memory: 128m }
    restart: unless-stopped

  api:
    <<: *backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { memory: 512m }

  worker:
    # Fast lane and discovery: LLM calls and page fetches, no browser or builds.
    <<: *backend
    command: ["python", "-m", "app.orchestrator.worker"]  # fast + discovery queues
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 1g }

  worker-heavy:
    # Heavy lane: Playwright audits, logo concepts and website builds for top leads only.
    <<: *backend
    command: ["arq", "app.orchestrator.worker.HeavyWorkerSettings"]
    depends_on:
      api:
        condition: service_healthy
    shm_size: 512m  # Chromium needs shared memory
    deploy:
      resources:
        limits: { memory: 2g }

  scheduler:
    <<: *backend
    command: ["arq", "app.orchestrator.scheduler.SchedulerSettings"]
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 256m }

  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: leads-dashboard:local
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 512m }
    restart: unless-stopped

  # Testing-mode mail sink: every outreach email lands here, nothing is really sent.
  # UI http://localhost:8025 · SMTP localhost:1025 (mailpit:1025 inside the stack).
  mailpit:
    image: axllent/mailpit:v1.32.0
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    volumes:
      - mailpitdata:/data
    deploy:
      resources:
        limits: { memory: 96m }
    restart: unless-stopped

  # Database browser (http://localhost:8081, server: postgres, user/password/db: leads).
  adminer:
    image: adminer:5.5.1-standalone
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 64m }
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "127.0.0.1:8080:8080"
      # preview-only site for a Cloudflare Tunnel (static files under /p/<id>/, nothing else)
      - "127.0.0.1:8090:8090"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/previews:/srv/previews:ro
    deploy:
      resources:
        limits: { memory: 64m }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  mailpitdata:
  sitebuilder:
